services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plan-mode-api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/plan_mode_api?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: npm run start:dev

  postgres:
    image: postgres:16-alpine
    container_name: plan-mode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plan_mode_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  api_node_modules:
  postgres_data:
